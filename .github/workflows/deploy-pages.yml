name: Deploy car auction site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate published data
        run: |
          python3 -m json.tool dist/combined80.json > /dev/null
          python3 -m json.tool dist/auction-comps.json > /dev/null
          python3 -m json.tool dist/marketplace-2026-09-23.json > /dev/null
          test -s dist/index.html
          test -s dist/combined.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
